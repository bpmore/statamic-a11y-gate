# The suite, on every pull request.
#
# Until now nothing ran it but whoever was at a keyboard. Nine pull requests
# were merged on the strength of a local run pasted into a description, which is
# exactly the shape of claim this addon refuses to accept from anybody else.
#
# Two jobs, because ext-intl is a `suggest` rather than a `require` and that is a
# promise: the addon has to work without it. `AccessibleName::normalize()` skips
# its Unicode fold when the extension is absent, so "Ｃｌｉｃｋ ｈｅｒｅ" in
# full-width characters stops being folded to "click here" and that link passes.
# That is a real behaviour difference rather than a tidy fallback, and the second
# job is what stops it becoming a crash instead.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here writes to the repository, comments on a pull request,
# or touches a package registry, so it should not be able to.
permissions:
  contents: read

# A second push to the same branch cancels the first. The suite takes seconds
# and the answer for an overwritten commit is worth nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP 8.4, ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      # Both jobs run to completion. Knowing that only the no-intl one broke is
      # most of the diagnosis, and cancelling it to save a minute throws that
      # away.
      fail-fast: false
      matrix:
        include:
          - name: with ext-intl
            extensions: dom, libxml, mbstring, intl
          # The leading colon is how setup-php removes an extension it would
          # otherwise ship by default. Without it this job would silently be a
          # duplicate of the one above.
          - name: without ext-intl
            extensions: dom, libxml, mbstring, :intl

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ matrix.extensions }}
          coverage: none

      # The panel's own logic is checked by a plain node script rather than a
      # JavaScript toolchain, because this addon has no npm and no build step on
      # purpose. See the decision log.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Before installing, because a malformed manifest on a published package
      # is otherwise found by Packagist, which is later and in front of an
      # audience. Publish checks left on for the same reason.
      - name: Check the manifest is well formed
        run: composer validate --strict

      # There is no composer.lock in this repository and there should not be:
      # this is a package an application installs, so the application's lock is
      # the one that matters. That makes every run here a fresh resolve against
      # the current Statamic, which is worth having. When this goes red on a
      # commit that changed nothing, a dependency moved, and that is a finding
      # rather than a nuisance.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # `PanelFailureStylingTest` calls `markTestSkipped` when node is missing,
      # and a skipped test is reported as a pass. On a runner with no node the
      # panel would quietly stop being checked at all, which is the failure this
      # whole addon is built to refuse, in its own pipeline. Fail here instead,
      # where the reason is one line.
      - name: Confirm the panel check can run rather than skip
        run: node --version

      - name: Run the suite
        run: ./vendor/bin/pest
